<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- スマホでピンチズームさせない（ARの操作を邪魔するため） -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>島根AR</title>
  </head>
  <body>
    <!-- MindAR がこの中にカメラ映像と canvas を作る -->
    <div id="ar-container"></div>

    <!-- 状態表示。読み込み中・エラー・案内をここに出す -->
    <div id="status"></div>

    <!-- 撮影ボタン。AR が起動するまでは隠しておく -->
    <button id="shutter" type="button" aria-label="写真を撮る" hidden></button>

    <!-- 撮影時に一瞬光らせる。押した手応えを出すため -->
    <div id="flash" aria-hidden="true"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
